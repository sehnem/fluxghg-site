AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  fluxGHG v2 — static site on S3 behind CloudFront (private bucket, OAC) plus the
  contact form Lambda. Deliberately a separate stack from `site-fluxghg` so the
  production site at fluxghg.com is never touched by a validation deploy.

Parameters:
  DomainName:
    Type: String
    Default: new.fluxghg.com
    Description: The single hostname this stack serves.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Hosted zone containing DomainName.
  BucketName:
    Type: String
    Default: fluxghg-site-v2
    Description: >
      Private origin bucket. Not named after the domain — the bucket is never
      addressed directly, only through CloudFront.

Resources:
  # ---------------------------------------------------------------- origin
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ------------------------------------------------------------- edge logic
  # Two jobs, both cheap enough for a viewer-request function:
  #   1. send visitors in Brazil and Portugal to the pt-BR site
  #   2. map directory-style URLs onto the index.html objects a private S3
  #      origin needs, since it resolves keys exactly and has no index document
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-viewer-request'
      AutoPublish: true
      FunctionConfig:
        Comment: Locale redirect by viewer country + directory index rewrite.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        var PT_COUNTRIES = { BR: true, PT: true };

        function redirect(location) {
          return {
            statusCode: 302,
            statusDescription: 'Found',
            headers: {
              location: { value: location },
              'cache-control': { value: 'no-cache' },
              vary: { value: 'CloudFront-Viewer-Country' }
            }
          };
        }

        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // Locale only applies to the site root; deep links are explicit.
          if (uri === '/' || uri === '/index.html') {
            var cookies = request.cookies || {};
            var chosen = cookies['fluxghg-lang'] ? cookies['fluxghg-lang'].value : '';

            if (chosen) {
              // An explicit choice in the language switcher always wins.
              if (chosen === 'pt') {
                return redirect('/pt/');
              }
            } else {
              var header = request.headers['cloudfront-viewer-country'];
              var country = header ? header.value.toUpperCase() : '';
              if (PT_COUNTRIES[country]) {
                return redirect('/pt/');
              }
            }
          }

          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # ----------------------------------------------------------------- backend
  ContactFormApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      # The form is same-origin through CloudFront, so no CORS config needed.

  ContactFormFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: contact_form/
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 256
      Events:
        ContactPost:
          Type: Api
          Properties:
            RestApiId: !Ref ContactFormApi
            Path: /contact
            Method: post
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

  # ----------------------------------------------------------------- delivery
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'fluxGHG v2 — ${DomainName}'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ApiOrigin
            DomainName: !Sub '${ContactFormApi}.execute-api.${AWS::Region}.amazonaws.com'
            OriginPath: /Prod
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN

        CacheBehaviors:
          # Fingerprinted build output — safe to cache hard at the edge.
          - PathPattern: '/_astro/*'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

          - PathPattern: '/contact'
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            # Managed-CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewerExceptHostHeader — API Gateway rejects a
            # forwarded Host header of the site domain.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  DomainRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2 # fixed CloudFront zone id
            DNSName: !GetAtt CloudFrontDistribution.DomainName
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt CloudFrontDistribution.DomainName

Outputs:
  SiteURL:
    Description: Public URL of the validation site
    Value: !Sub 'https://${DomainName}'
  BucketName:
    Description: Origin bucket for `aws s3 sync`
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution id, for cache invalidation
    Value: !Ref CloudFrontDistribution
  DistributionDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
